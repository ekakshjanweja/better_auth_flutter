name: CI

on:
  push:
    branches: [main, v3]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Populate the vigilant-spoon submodule: an empty submodule dir
          # makes `dart pub publish --dry-run` warn about a checked-in file
          # ignored by `.gitignore`.
          submodules: recurse

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated code is current
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      # Guards against shipping a release whose own documented import does not
      # resolve, and surfaces the pana deductions that drive pub.dev scoring.
      - name: Publish dry run
        run: dart pub publish --dry-run
