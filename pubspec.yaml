name: better_auth_flutter
description: "A Flutter client package for integrating with Better Auth - a
  secure authentication platform."
version: 0.1.2
homepage: https://www.better-auth.com/
repository: https://github.com/ekakshjanweja/better_auth_flutter
issue_tracker: https://github.com/ekakshjanweja/better_auth_flutter/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  connectivity_plus: ^7.3.1
  cookie_jar: ^4.0.8
  dio: ^5.9.2
  dio_cookie_manager: ^3.4.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^11.0.0
  flutter_web_auth_2: ^5.0.2
  freezed_annotation: ^3.1.0
  hive: ^2.2.3
  http: ^1.6.0
  json_annotation: ^4.12.0
  logger: ^2.7.0
  path_provider: ^2.1.5
  retrofit: ^4.10.0
  shared_preferences: ^2.5.5
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.7.2
  flutter_lints: ^6.0.0
  flutter_secure_storage_platform_interface: ^2.0.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  http_mock_adapter: ^0.6.1
  json_serializable: ^6.11.2
  retrofit_generator: ^10.2.5

platforms:
  ? android
  ? ios
  ? macos
  ? windows
  ? linux
